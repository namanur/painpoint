[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "painpoint"
version = "0.1.0"
description = "Lean Agent Orchestrator - Deterministic LLM Execution Engine"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0",
    "asyncpg",
    "fastmcp",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio",
]
llm = [
    "openai>=1.0",
    "anthropic>=0.7",
]

[tool.pytest.ini_options]
asyncio_mode = "strict"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.setuptools.packages.find]
where = ["src"]
